# Render deployment configuration
# Set DATABASE_URL + SYNC_DATABASE_URL in the dashboard when using Supabase.
# SYNC_DATABASE_URL must be a sync URL (postgresql:// or postgresql+psycopg2://) for Alembic.

services:
  - type: web
    name: logistics-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      # Optional: set to true once to ingest RAG docs (slow); leave false for fast boots.
      - key: INIT_VECTOR_STORE
        value: "false"
