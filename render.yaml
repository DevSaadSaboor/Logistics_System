# Render deployment configuration
databases:
  - name: logistics-db
    plan: free

services:
  - type: web
    name: logistics-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logistics-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: logistics-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
